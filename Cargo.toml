[workspace]
members = ["xtask"]
resolver = "3"

[workspace.package]
authors = ["Jasper van den Bogart"]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
anyhow = { version = "1.0.98", default-features = false }
serde = { version = "1.0.228", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0.145", default-features = false, features = [
  "alloc",
] }
time = { version = "0.3.44", default-features = false, features = [
  "parsing",
  "serde",
] }
xflags = { version = "0.3.2", default-features = false }
xshell = { version = "0.2.7", default-features = false }
